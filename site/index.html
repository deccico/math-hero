<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Hero: Addition and Subtraction Practice</title>
  <!-- Tailwind CSS and the kid-friendly Fredoka font (fonts/), compiled from src/tailwind.css by `npm run build:css`: never edit tailwind.css by hand -->
  <link rel="stylesheet" href="tailwind.css">
  <!-- Installable to the Home Screen: there, Safari keeps the offline copy instead of deleting it after 7 days unvisited -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Math Hero">
  <meta name="theme-color" content="#6366f1">
  
  <style>
    body {
      font-family: 'Fredoka', sans-serif;
      /* A vibrant, friendly background gradient */
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 1rem;
    }

    /* Hide the up/down arrows on number inputs for a cleaner look */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    input[type=number] {
      -moz-appearance: textfield;
    }

    /* Custom Animations */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-10px); }
      40%, 80% { transform: translateX(10px); }
    }
    
    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .animate-shake {
      animation: shake 0.4s ease-in-out;
      border-color: #ef4444 !important; /* Red border on error */
      background-color: #fef2f2 !important;
    }

    .animate-pop {
      animation: pop 0.3s ease-out;
    }

    /* Success state styling */
    .success-flash {
      background-color: #22c55e !important;
      color: white !important;
      transition: background-color 0.2s, color 0.2s;
    }
  </style>
</head>
<body>

  <!-- Main App Container -->
  <div id="appCard" class="bg-white p-8 sm:p-10 rounded-[2rem] shadow-2xl w-full max-w-lg transition-colors duration-300">
    
    <!-- Game Screen -->
    <div id="gameScreen">
      <!-- Progress -->
      <div class="text-center mb-6">
        <span class="bg-indigo-100 text-indigo-800 text-sm font-bold px-4 py-2 rounded-full uppercase tracking-widest border border-indigo-200"><span id="roundLabel">Question</span> <span id="questionCount">1</span> of <span id="questionTotal">10</span></span>
      </div>

      <!-- Scoreboard -->
      <div class="flex justify-between items-center mb-8 border-b-4 border-slate-100 pb-4">
        <div class="text-center">
          <div class="text-slate-400 font-bold uppercase text-sm tracking-wide">Streak</div>
          <div class="text-3xl font-bold text-orange-500">🔥 <span id="streakCount">0</span></div>
        </div>
        <div class="text-center">
          <div class="text-slate-400 font-bold uppercase text-sm tracking-wide">Solved</div>
          <div class="text-3xl font-bold text-emerald-500">⭐ <span id="totalCount">0</span></div>
        </div>
      </div>

      <!-- Problem Display -->
      <div class="text-center mb-8">
        <div id="problemDisplay" class="text-7xl sm:text-8xl font-bold text-slate-800 tracking-tight">
          <!-- Javascript will inject the problem here (e.g. 12 - 7) -->
        </div>
      </div>

      <!-- Help when stuck: a hint offered after a while, shown after two wrong tries, the answer after three -->
      <div class="text-center">
        <button id="hintBtn" type="button" class="hidden mb-6 px-4 py-2 rounded-full bg-amber-100 text-amber-800 font-semibold text-lg hover:bg-amber-200 focus:outline-none focus:ring-4 focus:ring-amber-100 transition-colors">💡 Need a hint?</button>
        <p id="hintText" role="status" class="hidden whitespace-pre-line mb-6 rounded-2xl border-2 border-amber-200 bg-amber-50 px-4 py-3 text-amber-900 font-semibold text-lg"></p>
      </div>

      <!-- Answer Input, with a Check button for keyboards that have no Enter key -->
      <div class="flex flex-col sm:flex-row items-center justify-center gap-4 mb-8">
        <input
          type="number"
          id="answerInput"
          inputmode="numeric"
          pattern="[0-9]*"
          autocomplete="off"
          class="w-48 text-center text-5xl sm:text-6xl font-bold py-4 rounded-3xl border-4 border-indigo-100 bg-indigo-50 text-slate-800 focus:outline-none focus:border-indigo-400 focus:ring-4 focus:ring-indigo-100 transition-all shadow-inner"
          placeholder="?"
          autofocus
        >
        <button id="checkBtn" type="button" class="w-48 sm:w-auto bg-indigo-500 hover:bg-indigo-600 text-white font-bold text-2xl py-4 px-6 rounded-3xl shadow-lg transition active:scale-95 focus:outline-none focus:ring-4 focus:ring-indigo-100">
          Check
        </button>
      </div>

      <!-- Settings Button -->
      <div class="text-center">
        <button id="settingsBtn" type="button" class="px-4 py-2 rounded-full text-slate-400 font-semibold text-lg hover:text-indigo-600 hover:bg-slate-100 focus:outline-none focus:ring-4 focus:ring-indigo-100 transition-colors">⚙️ Settings</button>
      </div>

    </div> <!-- End Game Screen -->

    <!-- Settings Screen: changes apply at once and are remembered on this device -->
    <div id="settingsScreen" class="hidden">
      <h2 class="text-3xl font-bold text-slate-800 text-center mb-6">Settings</h2>

      <h3 class="text-slate-500 font-bold mb-3 uppercase text-sm tracking-wide">Practice</h3>
      <div class="flex flex-wrap gap-x-8 gap-y-3 mb-6">
        <label class="flex items-center space-x-3 cursor-pointer group">
          <input type="checkbox" id="subtractToggle" class="w-6 h-6 text-indigo-600 rounded-lg border-2 border-slate-300 focus:ring-indigo-500 focus:ring-2 cursor-pointer">
          <span class="text-slate-700 font-semibold text-lg group-hover:text-indigo-600 transition-colors">Subtraction (-)</span>
        </label>
        <label class="flex items-center space-x-3 cursor-pointer group">
          <input type="checkbox" id="addToggle" class="w-6 h-6 text-indigo-600 rounded-lg border-2 border-slate-300 focus:ring-indigo-500 focus:ring-2 cursor-pointer">
          <span class="text-slate-700 font-semibold text-lg group-hover:text-indigo-600 transition-colors">Addition (+)</span>
        </label>
      </div>

      <h3 class="text-slate-500 font-bold mb-3 uppercase text-sm tracking-wide">Numbers (0 to 99)</h3>
      <div class="space-y-4 mb-6">
          <div class="flex flex-wrap items-center gap-x-3 gap-y-2">
            <span class="basis-full sm:basis-auto sm:w-36 text-slate-700 font-semibold text-lg">First number</span>
            <input type="number" id="firstMin" aria-label="First number, lowest" min="0" max="99" inputmode="numeric" class="w-20 text-center text-2xl font-bold py-2 rounded-xl border-2 border-slate-200 bg-slate-50 text-slate-800 focus:outline-none focus:border-indigo-400 focus:ring-4 focus:ring-indigo-100">
            <span class="text-slate-500 font-semibold">to</span>
            <input type="number" id="firstMax" aria-label="First number, highest" min="0" max="99" inputmode="numeric" class="w-20 text-center text-2xl font-bold py-2 rounded-xl border-2 border-slate-200 bg-slate-50 text-slate-800 focus:outline-none focus:border-indigo-400 focus:ring-4 focus:ring-indigo-100">
          </div>
          <div class="flex flex-wrap items-center gap-x-3 gap-y-2">
            <span class="basis-full sm:basis-auto sm:w-36 text-slate-700 font-semibold text-lg">Second number</span>
            <input type="number" id="secondMin" aria-label="Second number, lowest" min="0" max="99" inputmode="numeric" class="w-20 text-center text-2xl font-bold py-2 rounded-xl border-2 border-slate-200 bg-slate-50 text-slate-800 focus:outline-none focus:border-indigo-400 focus:ring-4 focus:ring-indigo-100">
            <span class="text-slate-500 font-semibold">to</span>
            <input type="number" id="secondMax" aria-label="Second number, highest" min="0" max="99" inputmode="numeric" class="w-20 text-center text-2xl font-bold py-2 rounded-xl border-2 border-slate-200 bg-slate-50 text-slate-800 focus:outline-none focus:border-indigo-400 focus:ring-4 focus:ring-indigo-100">
          </div>
      </div>

      <label class="flex items-center space-x-3 cursor-pointer group mb-6">
        <input type="checkbox" id="crossTenToggle" class="w-6 h-6 text-indigo-600 rounded-lg border-2 border-slate-300 focus:ring-indigo-500 focus:ring-2 cursor-pointer">
        <span class="text-slate-700 font-semibold text-lg group-hover:text-indigo-600 transition-colors">Must cross ten <br><span class="text-sm text-slate-400 font-normal">(borrowing: 12 - 7, carrying: 8 + 5)</span></span>
      </label>

      <p id="settingsWarning" role="status" class="hidden mb-6 rounded-2xl border-2 border-amber-200 bg-amber-50 p-4 text-amber-800 font-semibold"></p>

      <button id="settingsDoneBtn" type="button" class="bg-indigo-500 hover:bg-indigo-600 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-bold text-2xl py-4 px-8 rounded-full shadow-lg transition w-full">
        Done
      </button>
      <div class="text-center mt-3">
        <button id="settingsProgressBtn" type="button" class="px-4 py-2 rounded-full text-slate-500 font-semibold text-lg hover:text-indigo-600 hover:bg-slate-100 focus:outline-none focus:ring-4 focus:ring-indigo-100 transition-colors">📈 Progress</button>
      </div>
    </div>

    <!-- Progress Screen: the games saved on this device -->
    <div id="progressScreen" class="hidden">
      <h2 class="text-3xl font-bold text-slate-800 text-center mb-6">Progress</h2>

      <div id="historyOverview">
        <div class="grid grid-cols-3 gap-2 sm:gap-3 mb-4 text-center">
          <div class="rounded-2xl bg-slate-50 border-2 border-slate-100 px-1 py-3 sm:p-3">
            <div id="statGames" class="whitespace-nowrap text-xl sm:text-3xl font-bold text-indigo-600">0</div>
            <div class="text-xs font-bold uppercase sm:tracking-wide text-slate-400">Games</div>
          </div>
          <div class="rounded-2xl bg-slate-50 border-2 border-slate-100 px-1 py-3 sm:p-3">
            <div id="statAccuracy" class="whitespace-nowrap text-xl sm:text-3xl font-bold text-indigo-600">-</div>
            <div class="text-xs font-bold uppercase sm:tracking-wide text-slate-400">Right first time</div>
          </div>
          <div class="rounded-2xl bg-slate-50 border-2 border-slate-100 px-1 py-3 sm:p-3">
            <div id="statPace" class="whitespace-nowrap text-xl sm:text-3xl font-bold text-indigo-600">-</div>
            <div class="text-xs font-bold uppercase sm:tracking-wide text-slate-400">Per question</div>
          </div>
        </div>
        <p id="trendText" class="text-slate-600 font-semibold text-center mb-6"></p>

        <h3 class="text-slate-500 font-bold mb-3 uppercase text-sm tracking-wide">Recent rounds</h3>
        <p id="historyEmpty" class="text-slate-500 mb-6">No games yet. Finish a game to see it here.</p>
        <ul id="historyList" class="space-y-2 max-h-72 overflow-y-auto mb-6"></ul>
      </div>

      <div id="historyDetail" class="hidden">
        <h3 id="detailTitle" class="text-xl font-bold text-slate-800"></h3>
        <p id="detailSummary" class="text-slate-600 mb-4"></p>
        <ul id="detailReview" class="space-y-2 max-h-72 overflow-y-auto mb-6"></ul>
      </div>

      <button id="progressBackBtn" type="button" class="bg-indigo-500 hover:bg-indigo-600 text-white font-bold text-2xl py-4 px-8 rounded-full shadow-lg transition w-full">
        Back
      </button>
    </div>

    <!-- Results Screen: the score, the time, and the problems worth another look -->
    <div id="celebrationScreen" class="hidden flex flex-col items-center justify-center py-2 text-center">
      <div id="resultEmoji" class="text-7xl mb-4 animate-bounce">🏆</div>
      <h2 id="resultTitle" class="text-4xl font-bold text-slate-800 mb-2">You did it!</h2>
      <p id="resultScore" class="text-xl font-semibold text-slate-700"></p>
      <p id="resultTime" class="text-lg text-slate-500 mb-6"></p>

      <div id="reviewBox" class="hidden w-full text-left mb-6">
        <h3 class="text-slate-500 font-bold mb-3 uppercase text-sm tracking-wide">Look at these again</h3>
        <ul id="reviewList" class="space-y-2 max-h-72 overflow-y-auto"></ul>
      </div>

      <button id="practiceBtn" type="button" class="hidden bg-amber-500 hover:bg-amber-600 text-white font-bold text-xl sm:text-2xl py-4 px-8 rounded-full shadow-lg transform transition hover:scale-105 active:scale-95 w-full mb-3">
        Practice these again
      </button>
      <button id="playAgainBtn" type="button" class="bg-indigo-500 hover:bg-indigo-600 text-white font-bold text-2xl py-4 px-8 rounded-full shadow-lg transform transition hover:scale-105 active:scale-95 w-full">
        Play Again
      </button>
      <button id="resultsProgressBtn" type="button" class="mt-3 px-4 py-2 rounded-full text-slate-500 font-semibold text-lg hover:text-indigo-600 hover:bg-slate-100 focus:outline-none focus:ring-4 focus:ring-indigo-100 transition-colors">📈 Progress</button>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
