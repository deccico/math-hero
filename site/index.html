<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Hero: Subtraction Practice</title>
  <!-- Tailwind CSS and the kid-friendly Fredoka font (fonts/), compiled from src/tailwind.css by `npm run build:css`: never edit tailwind.css by hand -->
  <link rel="stylesheet" href="tailwind.css">
  
  <style>
    body {
      font-family: 'Fredoka', sans-serif;
      /* A vibrant, friendly background gradient */
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 1rem;
    }

    /* Hide the up/down arrows on number inputs for a cleaner look */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    input[type=number] {
      -moz-appearance: textfield;
    }

    /* Custom Animations */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-10px); }
      40%, 80% { transform: translateX(10px); }
    }
    
    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .animate-shake {
      animation: shake 0.4s ease-in-out;
      border-color: #ef4444 !important; /* Red border on error */
      background-color: #fef2f2 !important;
    }

    .animate-pop {
      animation: pop 0.3s ease-out;
    }

    /* Success state styling */
    .success-flash {
      background-color: #22c55e !important;
      color: white !important;
      transition: background-color 0.2s, color 0.2s;
    }
  </style>
</head>
<body>

  <!-- Main App Container -->
  <div id="appCard" class="bg-white p-8 sm:p-10 rounded-[2rem] shadow-2xl w-full max-w-lg transition-colors duration-300">
    
    <!-- Game Screen -->
    <div id="gameScreen">
      <!-- Progress -->
      <div class="text-center mb-6">
        <span class="bg-indigo-100 text-indigo-800 text-sm font-bold px-4 py-2 rounded-full uppercase tracking-widest border border-indigo-200">Question <span id="questionCount">1</span> of 10</span>
      </div>

      <!-- Scoreboard -->
      <div class="flex justify-between items-center mb-8 border-b-4 border-slate-100 pb-4">
        <div class="text-center">
          <div class="text-slate-400 font-bold uppercase text-sm tracking-wide">Streak</div>
          <div class="text-3xl font-bold text-orange-500">🔥 <span id="streakCount">0</span></div>
        </div>
        <div class="text-center">
          <div class="text-slate-400 font-bold uppercase text-sm tracking-wide">Solved</div>
          <div class="text-3xl font-bold text-emerald-500">⭐ <span id="totalCount">0</span></div>
        </div>
      </div>

      <!-- Problem Display -->
      <div class="text-center mb-8">
        <div id="problemDisplay" class="text-7xl sm:text-8xl font-bold text-slate-800 tracking-tight">
          <!-- Javascript will inject the problem here (e.g. 12 - 7) -->
        </div>
      </div>

      <!-- Answer Input -->
      <div class="flex justify-center mb-8">
        <input
          type="number"
          id="answerInput"
          inputmode="numeric"
          pattern="[0-9]*"
          autocomplete="off"
          class="w-48 text-center text-5xl sm:text-6xl font-bold py-4 rounded-3xl border-4 border-indigo-100 bg-indigo-50 text-slate-800 focus:outline-none focus:border-indigo-400 focus:ring-4 focus:ring-indigo-100 transition-all shadow-inner"
          placeholder="?"
          autofocus
        >
      </div>

      <!-- Settings Controls -->
      <div class="bg-slate-50 rounded-2xl p-4 border-2 border-slate-100">
        <h3 class="text-slate-500 font-bold mb-3 uppercase text-sm tracking-wide text-center">Settings</h3>

        <label class="flex items-center space-x-3 mb-3 cursor-pointer group">
          <input type="checkbox" id="teensToggle" checked class="w-6 h-6 text-indigo-600 rounded-lg border-2 border-slate-300 focus:ring-indigo-500 focus:ring-2 cursor-pointer">
          <span class="text-slate-700 font-semibold text-lg group-hover:text-indigo-600 transition-colors">Limit to teens (11 - 19)</span>
        </label>

        <label class="flex items-center space-x-3 cursor-pointer group">
          <input type="checkbox" id="borrowToggle" checked class="w-6 h-6 text-indigo-600 rounded-lg border-2 border-slate-300 focus:ring-indigo-500 focus:ring-2 cursor-pointer">
          <span class="text-slate-700 font-semibold text-lg group-hover:text-indigo-600 transition-colors">Must require borrowing <br><span class="text-sm text-slate-400 font-normal">(e.g., 12 - 7)</span></span>
        </label>
      </div>

    </div> <!-- End Game Screen -->

    <!-- Celebration Screen -->
    <div id="celebrationScreen" class="hidden flex flex-col items-center justify-center py-6 text-center">
      <div class="text-7xl mb-6 animate-bounce">🏆</div>
      <h2 class="text-4xl font-bold text-slate-800 mb-2">You did it!</h2>
      <p class="text-lg text-slate-600 mb-8">Awesome job completing 10 questions.</p>
      <button id="playAgainBtn" class="bg-indigo-500 hover:bg-indigo-600 text-white font-bold text-2xl py-4 px-8 rounded-full shadow-lg transform transition hover:scale-105 active:scale-95 w-full">
        Play Again
      </button>
    </div>

  </div>

  <!-- Audio elements for feedback (using data URIs to keep it single-file, optional usage) -->
  <script>
    // App State
    let currentA = 0;
    let currentB = 0;
    let streak = 0;
    let totalSolved = 0;
    let currentQuestion = 1;
    let advancing = false; // True while a correct answer waits for the next problem
    const maxQuestions = 10;

    // DOM Elements
    const problemDisplay = document.getElementById('problemDisplay');
    const answerInput = document.getElementById('answerInput');
    const streakCount = document.getElementById('streakCount');
    const totalCount = document.getElementById('totalCount');
    const teensToggle = document.getElementById('teensToggle');
    const borrowToggle = document.getElementById('borrowToggle');
    const appCard = document.getElementById('appCard');
    const gameScreen = document.getElementById('gameScreen');
    const celebrationScreen = document.getElementById('celebrationScreen');
    const questionCount = document.getElementById('questionCount');
    const playAgainBtn = document.getElementById('playAgainBtn');

    // Generate a random integer between min and max (inclusive)
    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    // Logic to generate the next math problem based on toggles
    function generateProblem() {
      const limitToTeens = teensToggle.checked;
      const requireBorrowing = borrowToggle.checked;
      
      let found = false;
      let a, b;

      // Keep guessing numbers until they match our exact requirements
      while (!found) {
        // Operand A: 2 digits. If teens only, 11-19. Otherwise, 11-99.
        a = limitToTeens ? getRandomInt(11, 19) : getRandomInt(11, 99);
        
        // Operand B: 1 digit (1-9)
        b = getRandomInt(1, 9);

        // Subtraction should always result in a positive number
        if (a <= b) continue;

        // Check borrowing rule
        const onesDigitOfA = a % 10;
        const needsToBorrow = onesDigitOfA < b;

        if (requireBorrowing && !needsToBorrow) {
          continue; // Skip if we require borrowing but this problem doesn't need it
        }

        // If we get here, the problem satisfies all conditions
        found = true;
      }

      currentA = a;
      currentB = b;
      
      // Update UI
      problemDisplay.textContent = `${currentA} - ${currentB}`;
      answerInput.value = '';
      answerInput.focus();
    }

    // Handle correct answer visually
    function handleSuccess() {
      advancing = true;
      streak++;
      totalSolved++;
      
      // Update score display
      streakCount.textContent = streak;
      totalCount.textContent = totalSolved;
      
      // Add success visual feedback
      appCard.classList.add('success-flash', 'animate-pop');
      
      // Remove visual feedback and generate new problem after a short delay
      setTimeout(() => {
        appCard.classList.remove('success-flash', 'animate-pop');
        advancing = false;
        
        if (currentQuestion >= maxQuestions) {
          gameScreen.classList.add('hidden');
          celebrationScreen.classList.remove('hidden');
        } else {
          currentQuestion++;
          questionCount.textContent = currentQuestion;
          generateProblem();
        }
      }, 350);
    }

    // Handle wrong answer visually
    function handleError() {
      streak = 0;
      streakCount.textContent = streak;
      
      // Remove animation class if it exists to allow re-triggering
      answerInput.classList.remove('animate-shake');
      
      // Trigger reflow to restart animation
      void answerInput.offsetWidth;
      
      // Add error animation
      answerInput.classList.add('animate-shake');
      
      // Select the text so the kid can easily type over their wrong answer
      answerInput.select();
      
      // Remove class after animation finishes
      setTimeout(() => {
        answerInput.classList.remove('animate-shake');
      }, 400);
    }

    // Listen for the "Enter" key on the input field
    answerInput.addEventListener('keydown', (e) => {
      // Ignore Enter while advancing, so a double press can't count one answer twice
      if (e.key === 'Enter' && !advancing) {
        const userAnswer = parseInt(answerInput.value, 10);
        
        // Ignore empty submissions
        if (isNaN(userAnswer)) return;

        const correctAnswer = currentA - currentB;
        
        if (userAnswer === correctAnswer) {
          handleSuccess();
        } else {
          handleError();
        }
      }
    });

    // Automatically generate a new problem if settings are changed
    teensToggle.addEventListener('change', () => {
      if (!gameScreen.classList.contains('hidden')) {
        generateProblem();
        answerInput.focus();
      }
    });
    
    borrowToggle.addEventListener('change', () => {
      if (!gameScreen.classList.contains('hidden')) {
        generateProblem();
        answerInput.focus();
      }
    });

    // Handle Play Again button click
    playAgainBtn.addEventListener('click', () => {
      currentQuestion = 1;
      streak = 0;
      questionCount.textContent = currentQuestion;
      streakCount.textContent = streak;
      
      celebrationScreen.classList.add('hidden');
      gameScreen.classList.remove('hidden');
      
      generateProblem();
    });

    // Ensure focus is kept on the input whenever clicking anywhere on the background
    document.body.addEventListener('click', (e) => {
      if (e.target !== teensToggle && e.target !== borrowToggle && e.target !== playAgainBtn && !gameScreen.classList.contains('hidden')) {
        answerInput.focus();
      }
    });

    // Initialize the first problem on load
    generateProblem();

    // Offline support (sw.js): the newest version when online, the stored one when offline.
    // Service workers need http(s), so opening the file from disk skips this.
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .catch((err) => console.error('Offline support unavailable:', err));
      });
    }

  </script>
</body>
</html>
